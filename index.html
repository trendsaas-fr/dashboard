<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>TrendSaaS — En travaux</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#0b0d12;--card:#141824;--fg:#eef1f7;--mut:#9aa3b5;--acc:#7c5cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--card);border:1px solid #232a3b;border-radius:18px;padding:36px 28px;max-width:440px;width:100%;text-align:center}
.ico{font-size:48px;line-height:1;margin-bottom:14px}
h1{font-size:24px;margin:0 0 10px;text-wrap:balance}
p{color:var(--mut);margin:0 0 8px}
.tag{display:inline-block;margin-top:16px;padding:6px 12px;border-radius:999px;background:rgba(124,92,255,.15);color:#b9a8ff;font-size:13px;letter-spacing:.02em}
</style>
</head>
<body>
<main class="card">
<div class="ico">🛠️</div>
<h1>Dashboard en travaux</h1>
<p>On fait une mise à jour de l'espace clippeurs.</p>
<p>Tes vues et tes gains continuent d'être comptés normalement : rien n'est perdu.</p>
<span class="tag">Retour très bientôt · TrendSaaS</span>
</main>
</body>
</html>
